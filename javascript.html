<html>
<head>
<title> my page</title>
</head>
<body bgcolor="green">
<h1><i><center>STRING AND MATHS FUNCTION</center></i></h1>
<script>
var a="hi i am";
var b="ruhsiad thairangal";
var c="non cs";
var d= a+b+c;
var e= -20;
var f= 30;
var g= 2.3333333333333333333333333333333;

document.write("<h2><b><u> STRING FUNCTION</h2></b></u>")
document.write("first name =" + a + "<br>");
document.write("middle name =" + b + "<br>");
document.write("last name =" + c + "<br>");
document.write("CONCATENATION =" + d + "<br>")
document.write("length =" ,d.length+ "<br>")
document.write("UPPERCASE =" + b.toUpperCase() + "<br>")
document.write("LOWERCASE =" + a.toLowerCase() + "<br>")
document.write("SLICE =" + d.slice(3,10) + "<br>")
document.write("<h2><u><b>MATHS FUNCTION</b></u></h2>")
document.write("addition =" + (e+g) + "<br>")
document.write("sum of three =" + (e+f+g) + "<br>")
document.write("power =" + Math.pow(g,2) + "<br>")
document.write("SQUARE =" +Math.sqrt(f) + "<br>")
document.write("ABSOLUTE VALE =" +Math.abs(e) + "<br>")
document.write("ROUNDUP =" +Math.round(g)+ "<br>")
document.write("CEIL =" + Math.ceil(g) + "<br>")
document.write("FLOOR =" + Math.floor(g) + "<br>")
</script>
</body>
</html>
